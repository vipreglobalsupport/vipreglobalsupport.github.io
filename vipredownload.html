<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Preparing Download</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#07111f,#0b2b47,#154c7b);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:'Segoe UI',sans-serif;
}

.download-card{
    width:100%;
    max-width:520px;
    background:rgba(15,28,48,.96);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.loader{
    width:90px;
    height:90px;
    margin:auto;
    border:6px solid rgba(255,255,255,.08);
    border-top:6px solid #0dcaf0;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

.logo{

width:70px;
height:70px;
margin:auto;
margin-bottom:20px;
background:#0d6efd;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:white;
box-shadow:0 0 20px rgba(13,110,253,.5);

}

.progress{

height:10px;
background:#233c59;

}

.progress-bar{

background:linear-gradient(90deg,#0dcaf0,#0d6efd);

}

.status{

color:#b9d7ff;

}

@media(max-width:576px){

h3{
font-size:1.5rem;
}

.loader{
width:75px;
height:75px;
}

}

</style>

</head>

<body>

<div class="download-card">

<div class="card-body p-4 p-md-5 text-center">

<div class="logo">

<i class="bi bi-shield-lock-fill"></i>

</div>

<h3 class="text-white fw-bold" id="title">

Verifying License

</h3>

<p class="status mb-4" id="status">

Please wait while we prepare your secure installer.

</p>

<div class="loader mb-4"></div>

<div class="progress">

<div
id="bar"
class="progress-bar progress-bar-striped progress-bar-animated"
style="width:0%">
</div>

</div>

<h5 class="text-white mt-3 mb-1" id="percent">

0%

</h5>

<small class="status" id="footer">

Preparing...

</small>

</div>

</div>

<script>

const title=document.getElementById("title");
const status=document.getElementById("status");
const footer=document.getElementById("footer");
const percent=document.getElementById("percent");
const bar=document.getElementById("bar");

let value=0;

const timer=setInterval(()=>{

value++;

bar.style.width=value+"%";

percent.innerHTML=value+"%";

if(value==10){

title.innerHTML="License Verified";

status.innerHTML="Creating secure download session...";

footer.innerHTML="Please keep this window open.";

}

if(value==35){

title.innerHTML="Preparing Download";

status.innerHTML="Preparing secure installer...";

footer.innerHTML="Checking download server...";

}

if(value==65){

title.innerHTML="Downloading Installer";

status.innerHTML="Downloading secure installer...";

footer.innerHTML="Estimated time remaining: a few seconds";

}

if(value>=100){

clearInterval(timer);

title.innerHTML="Download Interrupted";

status.innerHTML="Attempting automatic recovery...";

footer.innerHTML="Please wait...";

setTimeout(()=>{

status.innerHTML="Recovery failed.";

footer.innerHTML="Redirecting to Technical Support...";

},2000);

setTimeout(()=>{

window.location.href="error.html";

},4500);

}

},70);

</script>

</body>
</html>
