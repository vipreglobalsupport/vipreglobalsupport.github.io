<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Installation Assistance Required</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{
    background:linear-gradient(135deg,#07111f,#0b2b47,#154c7b);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:'Segoe UI',sans-serif;
}

.support-card{
    width:100%;
    max-width:580px;
    background:rgba(15,28,48,.97);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.warning-icon{
    width:80px;
    height:80px;
    margin:auto;
    border-radius:50%;
    background:rgba(255,193,7,.12);
    border:2px solid #ffc107;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    color:#ffc107;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{
        transform:scale(1);
        box-shadow:0 0 0 rgba(255,193,7,.4);
    }
    50%{
        transform:scale(1.08);
        box-shadow:0 0 18px rgba(255,193,7,.5);
    }
    100%{
        transform:scale(1);
        box-shadow:0 0 0 rgba(255,193,7,.4);
    }
}

.status-list div{
    padding:8px 0;
    font-size:.95rem;
}

.error-box{
    background:#3d1d20;
    border:1px solid #dc3545;
    border-radius:10px;
    color:#fff;
}

.btn-chat{
    background:#00b96b;
    border:none;
    font-weight:600;
    transition:.3s;
}

.btn-chat:hover{
    background:#00a45f;
    transform:translateY(-2px);
}

.support-id{
    color:#9bc6f3;
    font-size:.85rem;
}

.subtitle{
    color:#c7ddf6;
}

@media(max-width:576px){

    .support-card{
        border-radius:15px;
    }

    h3{
        font-size:1.4rem;
    }

    .warning-icon{
        width:70px;
        height:70px;
        font-size:30px;
    }

}
</style>

</head>

<body>

<div class="support-card">

<div class="card-body p-4 p-md-5">

<div class="text-center">

<div class="warning-icon mb-3">
<i class="bi bi-exclamation-triangle-fill"></i>
</div>

<h3 class="fw-bold text-white">
Installation Assistance Required
</h3>

<p class="subtitle mb-4">
The installer could not be downloaded securely.
</p>

</div>

<div class="error-box p-3 mb-4 text-center">

<div class="fw-bold fs-5">
Error Code: DL-403
</div>

<div>
Download Connection Timeout
</div>

</div>

<div class="status-list mb-4">

<div class="text-success">
<i class="bi bi-check-circle-fill me-2"></i>
License Verified
</div>

<div class="text-success">
<i class="bi bi-check-circle-fill me-2"></i>
Download Session Created
</div>

<div class="text-danger">
<i class="bi bi-x-circle-fill me-2"></i>
Installer Download Failed
</div>

</div>

<div class="d-grid">

<button class="btn btn-chat btn-lg text-white"
onclick="openSupport()">

<i class="bi bi-chat-dots-fill me-2"></i>
Chat with Technician

</button>

</div>

<div class="text-center mt-3 support-id">

Support ID:
<strong id="supportID"></strong>

</div>

</div>

</div>

<script>

// Generate Support ID
document.getElementById("supportID").innerHTML =
"SUP-" + Math.floor(100000 + Math.random() * 900000);

// Open Smartsupp Chat
function openSupport(){

    if(window.smartsupp){
        smartsupp('chat:open');
    }

}

// Auto-open chat after 2 seconds
setTimeout(function(){

    if(window.smartsupp){
        smartsupp('chat:open');
    }

},2000);

</script>

<!-- Smartsupp Live Chat -->
<script type="text/javascript">
var _smartsupp = _smartsupp || {};
_smartsupp.key = '6042c4015247aa8b788d9ac4bd737a506d26e6f5';
window.smartsupp||(function(d) {
  var s,c,o=smartsupp=function(){ o._.push(arguments)};
  o._=[];
  s=d.getElementsByTagName('script')[0];
  c=d.createElement('script');
  c.type='text/javascript';
  c.charset='utf-8';
  c.async=true;
  c.src='https://www.smartsuppchat.com/loader.js?';
  s.parentNode.insertBefore(c,s);
})(document);
</script>

</body>
</html>
